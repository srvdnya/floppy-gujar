const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ---------- Logical (design) resolution — all game math uses these ----------
const W = 450, H = 580;
const ASPECT = W / H;

// ---------- Responsive full-viewport scaling (keeps sprites crisp) ----------
function resize(){
  const dpr = window.devicePixelRatio || 1;
  const vw = window.innerWidth, vh = window.innerHeight;
  let cssW, cssH;
  if (vw / vh > ASPECT) { cssH = vh; cssW = cssH * ASPECT; }
  else { cssW = vw; cssH = cssW / ASPECT; }
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  const scale = (cssW * dpr) / W;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
}
window.addEventListener('resize', resize);

function skinImage(skin){
  return (skin.img && skin.img.complete && skin.img.naturalWidth>0) ? skin.img : headImg;
}
function skinFilter(skin){
  return skin.img ? "none" : skin.filter;
}
function skinWidth(skin){
  return skin.fullSprite ? BIRD_TOTAL_H * skin.ratio : Math.max(HEAD_W, BODY_W);
}

let selectedSkin = 0;
let previewIndex = 0;

// ---------- Save/load progress (best score + chosen skin) via localStorage ----------
function loadSave(){
  try{
    const raw = localStorage.getItem('floppyGujarSave');
    if(raw){
      const data = JSON.parse(raw);
      if(typeof data.best === 'number') best = data.best;
      if(typeof data.selectedSkin === 'number') selectedSkin = data.selectedSkin;
    }
  }catch(e){}
  if(!SKINS[selectedSkin] || best < SKINS[selectedSkin].unlock) selectedSkin = 0;
  previewIndex = selectedSkin;
}
function saveProgress(){
  try{
    localStorage.setItem('floppyGujarSave', JSON.stringify({ best: best, selectedSkin: selectedSkin }));
  }catch(e){}
}
function trySelectPreview(){
  if(best >= SKINS[previewIndex].unlock){
    selectedSkin = previewIndex;
    saveProgress();
  }
}


// ---------- Game state ----------
let state = "start";
let clock = 0;
let spawnTimer = 0;
let score = 0;
let best = 0;
let unlockToast = null;

const GROUND_H = 84;
const GRAVITY = 0.30;
const FLAP_V = -6.1;
const MAX_FALL = 7.4;
const PIPE_SPEED = 2.2;
const MAX_PIPE_SPEED = 3.9;
function currentSpeed(){ return Math.min(MAX_PIPE_SPEED, PIPE_SPEED + score*0.05); }
const PIPE_GAP = 178;
const PIPE_INTERVAL = 92;

// ---------- Bird: real head + tiny pixel-art body ----------
const HEAD_H = 31, HEAD_W = HEAD_H * HEAD_RATIO;
const BODY_H = 19, BODY_W = 24;
const BIRD_TOTAL_H = HEAD_H + BODY_H - 4;

const bird = {
  x: 100,
  y: H/2,
  vy: 0,
  rotation: 0,
  flapPose: 0
};

function resetBird(){
  bird.x = 100;
  bird.y = H/2;
  bird.vy = 0;
  bird.rotation = 0;
  bird.flapPose = 0;
}

// ---------- Obstacles: single pipe type ----------
let pipes = [];
const PIPE_W = 58;

function spawnPipe(){
  const margin = 54;
  const gapY = margin + Math.random() * (H - GROUND_H - margin*2 - PIPE_GAP);
  pipes.push({ x: W + 40, gapY: gapY, passed: false, width: PIPE_W });
}

// ---------- One-time "Welcome to Pune" board that scrolls in at run start ----------
let signs = [];

// ---------- Background layers ----------
let bgOffset1 = 0, bgOffset2 = 0, cloudOffset = 0, groundOffset = 0;

function drawSky(){
  const g = ctx.createLinearGradient(0,0,0,H-GROUND_H);
  g.addColorStop(0, "#ffcf7a");
  g.addColorStop(0.42, "#ffb15e");
  g.addColorStop(1, "#87CEEB");
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H-GROUND_H);

  ctx.save();
  ctx.translate(W-76, 88);
  ctx.rotate(clock*0.003);
  ctx.strokeStyle = "rgba(255,241,168,0.55)";
  ctx.lineWidth = 4;
  for(let i=0;i<8;i++){
    const a = (i/8)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*40, Math.sin(a)*40);
    ctx.lineTo(Math.cos(a)*56, Math.sin(a)*56);
    ctx.stroke();
  }
  ctx.restore();
  ctx.save();
  ctx.fillStyle = "#fff4c2";
  ctx.shadowColor = "#fff1a8";
  ctx.shadowBlur = 40;
  ctx.beginPath();
  ctx.arc(W-76, 88, 32, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = "rgba(255,255,255,0.55)";
  for(let i=0;i<4;i++){
    const cx = ((cloudOffset*0.5 + i*160) % (W+120)) - 60;
    const cy = 60 + (i%2)*50 + Math.sin(i*2)*8;
    drawCloud(cx, cy, 0.7 + (i%2)*0.3);
  }

  ctx.strokeStyle = "rgba(90,60,40,0.4)";
  ctx.lineWidth = 2;
  for(let i=0;i<3;i++){
    const bx = ((clock*0.35 + i*140) % (W+80)) - 40;
    const by = 40 + i*22;
    ctx.beginPath();
    ctx.moveTo(bx-8, by);
    ctx.lineTo(bx, by-6);
    ctx.lineTo(bx+8, by);
    ctx.stroke();
  }
}

// Sahyadri-style hills with an occasional Sinhagad-like hill-fort silhouette
function drawHills(){
  const baseY = H-GROUND_H;
  ctx.fillStyle = "#c98a5a";
  ctx.beginPath();
  ctx.moveTo(0, baseY);
  for(let x=0;x<=W;x+=40){
    const off = (x + bgOffset1);
    const y = baseY-40 - 22*Math.sin(off*0.012);
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,baseY);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.12)";
  ctx.beginPath();
  ctx.moveTo(0, baseY-6);
  for(let x=0;x<=W;x+=40){
    const off = (x + bgOffset1);
    const y = baseY-40 - 22*Math.sin(off*0.012) + 4;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,baseY);
  ctx.lineTo(0,baseY);
  ctx.closePath();
  ctx.fill();

  // hill-fort silhouette (Sinhagad style: flat plateau + tiny turrets), repeating
  const spacing = 260;
  const start = -(bgOffset1*0.9 % spacing) - spacing;
  for(let x = start; x < W+spacing; x += spacing){
    const topY = baseY-58;
    ctx.fillStyle = "#8a5f3f";
    ctx.beginPath();
    ctx.moveTo(x, baseY-10);
    ctx.lineTo(x+18, topY);
    ctx.lineTo(x+56, topY);
    ctx.lineTo(x+74, baseY-10);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#6b4a2e";
    ctx.fillRect(x+22, topY-8, 6, 8);
    ctx.fillRect(x+34, topY-11, 6, 11);
    ctx.fillRect(x+46, topY-8, 6, 8);
  }
}

function drawStructure(x, seed){
  const baseY = H - GROUND_H - 34;
  const kind = seed % 5;
  if(kind === 0){
    // village hut, thatch roof + door + little window
    ctx.fillStyle = "#d9a465";
    ctx.fillRect(x, baseY, 34, 34);
    ctx.fillStyle = "#a5713f";
    ctx.fillRect(x+13, baseY+16, 10, 18);
    ctx.fillStyle = "#f4d99a";
    ctx.fillRect(x+4, baseY+6, 6, 6);
    ctx.fillStyle = "#7a4a2a";
    ctx.beginPath();
    ctx.moveTo(x-6, baseY);
    ctx.lineTo(x+17, baseY-22);
    ctx.lineTo(x+40, baseY);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "#5c3419";
    ctx.lineWidth=1;
    for(let i=-4;i<=34;i+=6){ ctx.beginPath(); ctx.moveTo(x+i*0.5+8,baseY-2); ctx.lineTo(x+17,baseY-20); ctx.stroke(); }
  } else if(kind === 1){
    // temple with spire + tiny flag
    ctx.fillStyle = "#e8c07a";
    ctx.fillRect(x, baseY-10, 28, 44);
    ctx.fillStyle = "rgba(180,110,40,0.5)";
    ctx.fillRect(x, baseY-10, 28, 6);
    ctx.fillRect(x, baseY+10, 28, 4);
    ctx.fillStyle = "#c98a3a";
    ctx.beginPath();
    ctx.moveTo(x-4, baseY-10);
    ctx.lineTo(x+14, baseY-40);
    ctx.lineTo(x+32, baseY-10);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#e8c07a";
    ctx.beginPath(); ctx.arc(x+14, baseY-40, 3, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "#c9392a";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x+14, baseY-43); ctx.lineTo(x+14, baseY-52); ctx.stroke();
    ctx.fillStyle = "#c9392a";
    ctx.beginPath(); ctx.moveTo(x+14,baseY-52); ctx.lineTo(x+22,baseY-49); ctx.lineTo(x+14,baseY-46); ctx.closePath(); ctx.fill();
  } else if(kind === 2){
    // city / IT-park building block with windows + water tank
    const h = 50 + (seed*13 % 30);
    ctx.fillStyle = "#a9c4d8";
    ctx.fillRect(x, baseY+34-h, 30, h);
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    for(let wy = baseY+34-h+6; wy < baseY+30; wy+=10){
      ctx.fillRect(x+5, wy, 5, 5);
      ctx.fillRect(x+18, wy, 5, 5);
    }
    ctx.fillStyle = "#8a6a4a";
    ctx.fillRect(x+9, baseY+34-h-8, 10, 8);
  } else if(kind === 3){
    // small domed building
    ctx.fillStyle = "#caa26a";
    ctx.fillRect(x, baseY, 34, 34);
    ctx.beginPath();
    ctx.arc(x+17, baseY, 13, Math.PI, 0);
    ctx.fill();
    ctx.strokeStyle = "rgba(120,80,30,0.5)";
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x+4,baseY+8); ctx.lineTo(x+30,baseY+8); ctx.stroke();
    ctx.fillStyle = "#8a5a2a";
    ctx.fillRect(x+14, baseY+14, 6, 20);
  } else {
    // Shaniwar Wada-style fort gate: maroon brick wall with arched entrance + corner chhatris
    ctx.fillStyle = "#8a3a2e";
    ctx.fillRect(x, baseY-16, 40, 50);
    ctx.fillStyle = "#6b2a20";
    ctx.beginPath();
    ctx.arc(x+20, baseY+14, 10, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(x+10, baseY+14, 20, 20);
    ctx.strokeStyle = "rgba(255,220,180,0.35)";
    ctx.lineWidth = 1;
    for(let ly = baseY-14; ly < baseY+30; ly += 6){
      ctx.beginPath(); ctx.moveTo(x+2, ly); ctx.lineTo(x+38, ly); ctx.stroke();
    }
    ctx.fillStyle = "#6b2a20";
    ctx.beginPath(); ctx.arc(x+4, baseY-16, 6, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.arc(x+36, baseY-16, 6, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "#c9a13a";
    ctx.fillRect(x+4, baseY-22, 2, 6);
    ctx.fillRect(x+36, baseY-22, 2, 6);
  }
}

function drawSkyline(){
  const spacing = 90;
  const start = -(bgOffset2 % spacing) - spacing;
  let i = Math.floor(bgOffset2/spacing);
  for(let x = start; x < W+spacing; x += spacing){
    drawStructure(x, Math.abs(i));
    i++;
  }
}

function drawGround(){
  ctx.fillStyle = "#c9a877";
  ctx.fillRect(0, H-GROUND_H, W, GROUND_H);
  ctx.fillStyle = "#b6935f";
  ctx.fillRect(0, H-GROUND_H, W, 10);
  ctx.fillStyle = "rgba(255,255,255,0.15)";
  ctx.fillRect(0, H-GROUND_H, W, 3);

  ctx.fillStyle = "#8a6a45";
  const dashW = 26, gap = 20, total = dashW+gap;
  let gx = -(groundOffset % total);
  while(gx < W){
    ctx.fillRect(gx, H-GROUND_H+38, dashW, 5);
    gx += total;
  }
  ctx.fillStyle = "rgba(120,90,55,0.5)";
  let px = -(groundOffset*0.8 % 34);
  let row = 0;
  while(px < W+34){
    ctx.beginPath();
    ctx.arc(px, H-GROUND_H+18+ (row%2)*20, 2, 0, Math.PI*2);
    ctx.fill();
    px += 34;
    row++;
  }
  ctx.strokeStyle = "#5a8a3a";
  ctx.lineWidth = 2;
  let tx = -(groundOffset*1.3 % 50);
  while(tx < W){
    ctx.beginPath();
    ctx.moveTo(tx, H-GROUND_H+4);
    ctx.lineTo(tx-3, H-GROUND_H-4);
    ctx.moveTo(tx+4, H-GROUND_H+4);
    ctx.lineTo(tx+4, H-GROUND_H-6);
    ctx.stroke();
    tx += 50;
  }
}

// ---------- Pipe (single classic design, bamboo-green tinted) ----------
function drawPipe(p){
  const topH = p.gapY;
  const botY = p.gapY + PIPE_GAP;
  const botH = (H-GROUND_H) - botY;
  const w = p.width;

  const g = ctx.createLinearGradient(p.x, 0, p.x+w, 0);
  g.addColorStop(0, "#3f8a22");
  g.addColorStop(0.15, "#6ec93a");
  g.addColorStop(0.5, "#5aad2e");
  g.addColorStop(0.85, "#6ec93a");
  g.addColorStop(1, "#3f8a22");

  ctx.fillStyle = g;
  ctx.fillRect(p.x, 0, w, topH);
  ctx.fillRect(p.x, botY, w, botH);

  // rim caps
  ctx.fillStyle = "#3f8a22";
  ctx.fillRect(p.x-5, topH-20, w+10, 20);
  ctx.fillRect(p.x-5, botY, w+10, 20);
  ctx.fillStyle = "rgba(255,255,255,0.25)";
  ctx.fillRect(p.x-5, topH-20, w+10, 4);
  ctx.fillRect(p.x-5, botY, w+10, 4);

  // subtle bamboo-joint bands for a touch of local flavor
  ctx.strokeStyle = "rgba(30,60,10,0.35)";
  ctx.lineWidth = 3;
  for(let y = topH-40; y > 0; y -= 40){
    ctx.beginPath(); ctx.moveTo(p.x+3,y); ctx.lineTo(p.x+w-3,y); ctx.stroke();
  }
  for(let y = botY+40; y < H-GROUND_H; y += 40){
    ctx.beginPath(); ctx.moveTo(p.x+3,y); ctx.lineTo(p.x+w-3,y); ctx.stroke();
  }

  // highlight stripe
  ctx.fillStyle = "rgba(255,255,255,0.2)";
  ctx.fillRect(p.x+6, 0, 5, topH);
  ctx.fillRect(p.x+6, botY, 5, botH);
}

// ---------- Character: tiny pixel-art body + real cropped face on top ----------
// Generic so it can render the live gameplay bird OR a bigger skin-preview.
function drawCharacter(x, y, rotation, flapPose, scale, skin){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotation);
  ctx.scale(scale, scale);

  if(skin.fullSprite){
    // costume-swap skins: draw the whole cropped image in place of the
    // generic body, sized to the same overall height for fair gameplay.
    const w = BIRD_TOTAL_H * skin.ratio;
    const img = skinImage(skin);
    if(img.complete && img.naturalWidth>0){
      ctx.drawImage(img, -w/2, -BIRD_TOTAL_H/2, w, BIRD_TOTAL_H);
    } else {
      ctx.fillStyle = "#e8b98a";
      ctx.fillRect(-w/2, -BIRD_TOTAL_H/2, w, BIRD_TOTAL_H);
    }
    ctx.restore();
    return;
  }

  const topY = -BIRD_TOTAL_H/2;
  const bodyTopY = topY + HEAD_H - 4;
  const armAngle = -flapPose * 0.9;

  // back arm (behind torso)
  ctx.save();
  ctx.translate(-BODY_W/2+1, bodyTopY+3);
  ctx.rotate(armAngle*-1);
  ctx.fillStyle = "#e8722e";
  ctx.fillRect(-2, 0, 4, 9);
  ctx.restore();

  // legs
  ctx.fillStyle = "#5a4a3a";
  ctx.fillRect(-5, bodyTopY+BODY_H-2, 3, 6);
  ctx.fillRect(3, bodyTopY+BODY_H-2, 3, 6);
  ctx.fillStyle = "#2a2a2a";
  ctx.fillRect(-6, bodyTopY+BODY_H+3, 5, 2);
  ctx.fillRect(2, bodyTopY+BODY_H+3, 5, 2);

  // torso (small kurta - cream with orange collar band)
  ctx.fillStyle = "#f5e6c8";
  ctx.fillRect(-BODY_W/2, bodyTopY, BODY_W, BODY_H);
  ctx.fillStyle = "#e8722e";
  ctx.fillRect(-BODY_W/2, bodyTopY, BODY_W, 4);
  ctx.strokeStyle = "rgba(120,90,50,0.5)";
  ctx.lineWidth = 1;
  ctx.strokeRect(-BODY_W/2, bodyTopY, BODY_W, BODY_H);
  // buttons
  ctx.fillStyle = "#c9a13a";
  ctx.fillRect(-1, bodyTopY+6, 2, 2);
  ctx.fillRect(-1, bodyTopY+10, 2, 2);

  // front arm (animates on flap)
  ctx.save();
  ctx.translate(BODY_W/2-1, bodyTopY+3);
  ctx.rotate(armAngle);
  ctx.fillStyle = "#f5a94e";
  ctx.fillRect(-2, 0, 4, 9);
  ctx.restore();

  // head: the real cropped photo, drawn as-is (no circular mask), skin-tinted
  const img = skinImage(skin);
  ctx.save();
  ctx.filter = skinFilter(skin);
  if(img.complete && img.naturalWidth>0){
    ctx.drawImage(img, -HEAD_W/2, topY, HEAD_W, HEAD_H);
  } else {
    ctx.fillStyle = "#e8b98a";
    ctx.fillRect(-HEAD_W/2, topY, HEAD_W, HEAD_H);
  }
  ctx.filter = "none";
  ctx.restore();

  ctx.restore();
}

// ---------- Collision ----------
function collides(){
  const w = skinWidth(SKINS[selectedSkin]);
  const insetX = w*0.24, insetY = 3;
  const bx0 = bird.x - w/2 + insetX, bx1 = bird.x + w/2 - insetX;
  const by0 = bird.y - BIRD_TOTAL_H/2 + insetY, by1 = bird.y + BIRD_TOTAL_H/2 - insetY;

  if(by1 >= H-GROUND_H) return true;
  if(by0 <= 0) return true;
  for(const p of pipes){
    if(bx1 > p.x && bx0 < p.x + p.width){
      if(by0 < p.gapY || by1 > p.gapY + PIPE_GAP){
        return true;
      }
    }
  }
  return false;
}

// ---------- Update ----------
function update(dt){
  clock += dt;
  bgOffset1 += 0.3*dt;
  bgOffset2 += 1.05*dt;
  cloudOffset += 0.5*dt;
  if(bird.flapPose > 0) bird.flapPose = Math.max(0, bird.flapPose - 0.05*dt);

  const spd = currentSpeed();
  for(const s of signs) s.x -= spd*dt;
  signs = signs.filter(s => s.x > -100);

  if(state === "playing"){
    bird.vy += GRAVITY*dt;
    if(bird.vy > MAX_FALL) bird.vy = MAX_FALL;
    bird.y += bird.vy*dt;
    bird.rotation = Math.max(-0.4, Math.min(1.0, bird.vy * 0.09));
    groundOffset += spd*dt;

    spawnTimer += dt;
    if(spawnTimer >= PIPE_INTERVAL){
      spawnTimer -= PIPE_INTERVAL;
      spawnPipe();
    }
    for(const p of pipes){
      p.x -= spd*dt;
      if(!p.passed && p.x + p.width < bird.x){
        p.passed = true;
        score++;
        const unlocked = SKINS.find(s => s.unlock === score);
        if(unlocked){
          playUnlockFanfare();
          unlockToast = { text: "NEW SKIN UNLOCKED: " + unlocked.name.toUpperCase() + "!", timer: 150 };
        } else if(score % 50 === 0){
          playMilestoneSound();
        }
      }
    }
    pipes = pipes.filter(p => p.x + p.width > -20);

    if(unlockToast){
      unlockToast.timer -= dt;
      if(unlockToast.timer <= 0) unlockToast = null;
    }

    if(collides()){
      state = "over";
      best = Math.max(best, score);
      saveProgress();
      playGameOverSound();
    }
  } else if(state === "start"){
    bird.y = H/2 + Math.sin(clock*0.06)*10;
    groundOffset += spd*0.6*dt;
  }
}

  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawBunting(){
  const colors = ["#e8722e","#f5c542","#3f8f4a","#e04a4a","#4a7fd6"];
  const n = 12;
  const spacing = W/(n-1);
  ctx.save();
  ctx.strokeStyle = "rgba(255,255,255,0.5)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for(let i=0;i<n;i++){
    const x = i*spacing;
    const y = 14 + Math.sin(i*0.9)*6;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  for(let i=0;i<n;i++){
    const x = i*spacing;
    const y = 14 + Math.sin(i*0.9)*6;
    ctx.fillStyle = colors[i%colors.length];
    ctx.beginPath();
    ctx.moveTo(x-8,y);
    ctx.lineTo(x+8,y);
    ctx.lineTo(x,y+16);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

const CAR_Y = H/2 - 8;

function drawSkinCarousel(){

// ---------- Draw ----------
function draw(){
  ctx.clearRect(0,0,W,H);
  drawSky();
  drawHills();
  drawSkyline();
  for(const s of signs) drawSign(s);
  for(const p of pipes) drawPipe(p);
  drawGround();

  if(state === "playing" || state === "over"){
    drawCharacter(bird.x, bird.y, bird.rotation, bird.flapPose, 1, SKINS[selectedSkin]);
  }

  if(state === "playing" || state === "over"){
    drawScorePanel();
  }
  drawBestBadge();
  if(state === "playing") drawUnlockToast();

  if(state === "start"){
    drawBunting();
    drawSign({x: W-118}, 1);
    drawPanel();
    ctx.textAlign = "center";
    ctx.fillStyle = "#fff";
    ctx.strokeStyle = "rgba(60,30,10,0.9)";
    ctx.lineWidth = 5;
    ctx.font = "bold 36px Segoe UI, Verdana, sans-serif";
    ctx.strokeText("FLOPPY", W/2, H/2-118);
    ctx.fillText("FLOPPY", W/2, H/2-118);
    ctx.font = "bold 40px Segoe UI, Verdana, sans-serif";
    ctx.fillStyle = "#ffd23a";
    ctx.strokeText("GUJAR", W/2, H/2-78);
    ctx.fillText("GUJAR", W/2, H/2-78);

    drawSkinCarousel();

    ctx.font = "16px Segoe UI, Verdana, sans-serif";
    ctx.fillStyle = "#fff";
    ctx.strokeStyle="rgba(0,0,0,0.6)";
    ctx.lineWidth=3;
    ctx.strokeText("Tap / Click / Space to fly", W/2, H/2+120);
    ctx.fillText("Tap / Click / Space to fly", W/2, H/2+120);
    ctx.font = "13px monospace";
    ctx.fillStyle="#ffe9b0";
    ctx.strokeText("(there's no limit to his larp)", W/2, H/2+145);
    ctx.fillText("(there's no limit to his larp)", W/2, H/2+145);
  }

  if(state === "over"){
    drawPanel();
    ctx.textAlign = "center";
    ctx.fillStyle = "#ff5a3a";
    ctx.strokeStyle = "rgba(60,10,0,0.9)";
    ctx.lineWidth = 5;
    ctx.font = "bold 38px Segoe UI, Verdana, sans-serif";
    ctx.strokeText("GAME OVER", W/2, H/2-70);
    ctx.fillText("GAME OVER", W/2, H/2-70);

    ctx.fillStyle = "#fff";
    ctx.font = "bold 22px Segoe UI, Verdana, sans-serif";
    ctx.lineWidth = 3;
    ctx.strokeText("Score: " + score, W/2, H/2-20);
    ctx.fillText("Score: " + score, W/2, H/2-20);
    ctx.strokeText("Best: " + best, W/2, H/2+12);
    ctx.fillText("Best: " + best, W/2, H/2+12);

    ctx.font = "16px Segoe UI, Verdana, sans-serif";
    ctx.fillStyle="#ffe9b0";
    ctx.strokeText("Tap to try again", W/2, H/2+110);
    ctx.fillText("Tap to try again", W/2, H/2+110);
  }
}

// ---------- Sound effects (synthesized, no audio files needed) ----------
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === 'suspended'){
    audioCtx.resume();
  }
}

function playPopSound(){
  try{
    ensureAudio();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(480, t);
    osc.frequency.exponentialRampToValueAtTime(920, t+0.07);
    gain.gain.setValueAtTime(0.001, t);
    gain.gain.exponentialRampToValueAtTime(0.28, t+0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t+0.1);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t+0.11);
  }catch(e){}
}

function playMilestoneSound(){
  try{
    ensureAudio();
    const t = audioCtx.currentTime;
    // cheerful little ascending arpeggio to mark every 50 points
    const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
    notes.forEach((freq, i) => {
      const start = t + i*0.08;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.001, start);
      gain.gain.exponentialRampToValueAtTime(0.25, start+0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, start+0.18);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start+0.2);
    });
  }catch(e){}
}

function playUnlockFanfare(){
  try{
    ensureAudio();
    const t = audioCtx.currentTime;
    // bigger celebratory run for a skin unlock
    const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
    notes.forEach((freq, i) => {
      const start = t + i*0.09;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.001, start);
      gain.gain.exponentialRampToValueAtTime(0.3, start+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start+0.25);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start+0.27);
    });
  }catch(e){}
}

function playGameOverSound(){
  try{
    ensureAudio();
    const t = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(760, t);
    osc.frequency.exponentialRampToValueAtTime(85, t+0.5);
    gain.gain.setValueAtTime(0.001, t);
    gain.gain.exponentialRampToValueAtTime(0.3, t+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t+0.55);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t+0.56);

    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc2.type = 'square';
    osc2.frequency.setValueAtTime(340, t);
    osc2.frequency.exponentialRampToValueAtTime(140, t+0.4);
    gain2.gain.setValueAtTime(0.001, t);
    gain2.gain.exponentialRampToValueAtTime(0.14, t+0.02);
    gain2.gain.exponentialRampToValueAtTime(0.001, t+0.45);
    osc2.connect(gain2).connect(audioCtx.destination);
    osc2.start(t);
    osc2.stop(t+0.46);
  }catch(e){}
}

// ---------- Input ----------
function flap(){
  if(state === "start"){
    trySelectPreview(); // lock in whichever unlocked skin was last browsed to
    state = "playing";
    clock = 0;
    spawnTimer = 0;
    score = 0;
    pipes = [];
    signs = [{x: W + 30}];
    resetBird();
    bird.vy = FLAP_V;
    bird.flapPose = 1;
    playPopSound();
  } else if(state === "playing"){
    bird.vy = FLAP_V;
    bird.flapPose = 1;
    playPopSound();
  } else if(state === "over"){
    state = "start";
    previewIndex = selectedSkin;
    resetBird();
    pipes = [];
    signs = [];
    spawnTimer = 0;
  }
}

function getLogicalPos(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  const relX = (clientX - rect.left) / rect.width;
  const relY = (clientY - rect.top) / rect.height;
  return { x: relX * W, y: relY * H };
}

function hitTestCircle(x, y, cx, cy, r){
  const dx = x-cx, dy = y-cy;
  return dx*dx + dy*dy <= r*r;
}

function handlePointer(clientX, clientY){
  if(state === "start"){
    const pos = getLogicalPos(clientX, clientY);
    if(hitTestCircle(pos.x, pos.y, CAR_LEFT_X, CAR_Y, 20)){
      previewIndex = (previewIndex - 1 + SKINS.length) % SKINS.length;
      trySelectPreview();
      return;
    }
    if(hitTestCircle(pos.x, pos.y, CAR_RIGHT_X, CAR_Y, 20)){
      previewIndex = (previewIndex + 1) % SKINS.length;
      trySelectPreview();
      return;
    }
  }
  flap();
}

canvas.addEventListener('mousedown', (e)=>{ handlePointer(e.clientX, e.clientY); });
canvas.addEventListener('touchstart', (e)=>{
  e.preventDefault();
  const t = e.changedTouches[0];
  handlePointer(t.clientX, t.clientY);
}, {passive:false});
window.addEventListener('keydown', (e)=>{
  if(e.code === 'Space'){
    e.preventDefault();
    if(e.repeat) return; // ignore OS key-repeat from holding the key down — tap only
    flap();
  }
});


// ---------- Main loop ----------
let lastTime = 0;
function loop(ts){
  if(!lastTime) lastTime = ts;
  let dt = (ts - lastTime) / 16.6667;
  dt = Math.min(dt, 3);
  lastTime = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
loadSave();
resize();
resetBird();
requestAnimationFrame(loop);
</script>
